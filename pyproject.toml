[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-runner"
version = "0.1.0"
description = "An original rhythm-platformer prototype built with Pygame"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Berat Beşli" }]
dependencies = [
    "pygame>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
]

[project.scripts]
pulse-runner = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
